services:
  alsoir:
    image: alsoir
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_FUNCTIONS_URL: ${VITE_SUPABASE_FUNCTIONS_URL}
        VITE_LLM_PROVIDER: groq
        VITE_GROQ_MODEL: openai/gpt-oss-120b
    ports:
      - "3100:80"
    restart: unless-stopped

  alsoir-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_SUPABASE_FUNCTIONS_URL=${VITE_SUPABASE_FUNCTIONS_URL}
      - VITE_LLM_PROVIDER=${VITE_LLM_PROVIDER}
      - VITE_GROQ_MODEL=${VITE_GROQ_MODEL}
